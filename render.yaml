services:
  - type: web
    name: v-social-p
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node server.js
    disk:
      name: vp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
